name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc13
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
          - name: linux-clang18
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
          - name: macos-appleclang
            os: macos-14
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev zlib1g-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ./build/lob_tests
      - name: L3 book benchmark (smoke)
        run: ./build/lob_bench_l3

  sanitizers:
    name: linux-clang18-${{ matrix.san }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - san: asan-ubsan
            flags: -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer
          - san: tsan
            flags: -fsanitize=thread
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev zlib1g-dev
      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"
      - name: Build tests
        run: cmake --build build -j --target lob_tests
      - name: Test
        env:
          # TSan on recent Ubuntu kernels needs lower ASLR entropy.
          TSAN_OPTIONS: halt_on_error=1
        run: |
          if [ "${{ matrix.san }}" = "tsan" ]; then sudo sysctl vm.mmap_rnd_bits=28; fi
          ./build/lob_tests
